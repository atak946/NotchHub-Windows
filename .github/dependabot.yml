version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # Ana surum atlamalari elle degerlendirilir; guvenlik guncellemeleri bundan etkilenmez
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
